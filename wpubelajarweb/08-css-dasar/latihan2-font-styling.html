<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Galau</title>
    <style>
        body{
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: rgb(61, 61, 61);
            text-align: center;
        }

        h1{
            font-size: 48px;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 10px;
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color: rgb(100, 100, 100);
            text-shadow: 5px 5px 0 rgb(215, 215, 215);
        }

        .quote{
            font-size: 22px;
            line-height: 2.2;
            word-spacing: 5px;
        }

        span{
            color: rgb(181, 181, 181);
            text-decoration: line-through;
        }

        .credit{
            font-size: 12px;
            letter-spacing: 2px;
            color: rgb(151, 151, 151);
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>menunggu waktu</h1>

    <p class="quote">"Hujan turun mengiringi sepi yang kian menjadi.<br>

        Berharap ada sapaan hangat di ujung hari.<br>

        Namun yang tersisa hanya sunyi yang menemani,<br>

        Dan kenangan kita yang enggan <span>pergi</span>."</p><br>
    
    <P class="credit">- Taufik Ramadhan</P>
</body>
</html>
