<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Galau</title>
    <style>
        body {
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: bold;
            color: #E2E8F0;
            text-align: center;
            background-color: #1E2229;
            background-image: linear-gradient(to bottom, rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.3)), url('https://picsum.photos/id/1038/1920/1080');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }

        h1 {
            font-size: 4em;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 10px;
            text-decoration: none;
            /* text-shadow: 5px 5px 0px rgba(215, 215, 215 / 10%); */
            background-image: linear-gradient(to right, rgb(56, 189, 248) 20%, rgb(244, 114, 184));
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.6));

        }

        .quote {
            font-size: 22px;
            line-height: 1.2;
            word-spacing: 5px;
            background-color: rgba(255, 255, 255, 0.05) ;
            max-width: 600px;
            margin: auto;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 10%);
            box-shadow: 0 10px 30px rgb(0 0 0 / 50%);
        }

        span {
            color: crimson;
            text-decoration: none;
            text-shadow: 0 0 10px rgb(248, 50, 89);
        }

        .credit {
             font-size: 12px;
             letter-spacing: 2px;
             color: rgba(151, 151, 151, 0.7);
             font-weight: normal;
              text-transform: uppercase;
              border-top: 1px solid rgba(255, 255, 255, 0.2);
              width: 30%;
              margin: 30px auto;
               padding-top: 20px;
        }

    </style>
</head>
<body>

    <h1>MENUNGGU WAKTU</h1>

    <div class="quote">
        "Hujan turun mengiringi sepi yang kian menjadi.<br>
        Berharap ada sapaan hangat di ujung hari.<br>
        Namun yang tersisa hanya sunyi yang menemani,<br>
        Dan kenangan kita yang enggan <span>pergi</span>."
    </div>

    <div class="credit">
        - taufik ramadhan
    </div>

</body>
</html>
