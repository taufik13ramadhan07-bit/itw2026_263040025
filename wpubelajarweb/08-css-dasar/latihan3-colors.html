<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Galau</title>
    <style>
        body{
            font-family: 'playfair Diplay', Georgia, serif;
            font-weight: bold;
            color: #D8DEE9;
            text-align: center;
            background-color: #1E2229;

        }

        h1{
            font-size: 48px;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 10px;
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color: #BF616A;
            text-shadow: 5px 5px 0 rgb(215 215 215 / 10%);
            color: #38BAF4;
        }

        .quote{
            font-size: 22px;
            line-height: 2.2;
            word-spacing: 5px;
        }

        span{
            color: #D08770;
            text-decoration: line-through;
        }

        .credit{
            font-size: 12px;
            letter-spacing: 2px;
            color: #88C0D0;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>menunggu waktu</h1>

    <p class="quote">"Hujan turun mengiringi sepi yang kian menjadi.<br>

        Berharap ada sapaan hangat di ujung hari.<br>

        Namun yang tersisa hanya sunyi yang menemani,<br>

        Dan kenangan kita yang enggan <span>pergi</span>."</p><br>
    
    <P class="credit">- Taufik Ramadhan</P>
</body>
</html>
